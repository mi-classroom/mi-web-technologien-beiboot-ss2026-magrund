<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Marcel Grund Beiboot Projekt</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="camera-window">
    <video
      id="video"
      autoplay
      playsinline>
    </video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="info-window">
    <div class="fps">
      FPS:
      <span id="fps">0</span>
    </div>
    <div class="card">
      <h2>Left Hand</h2>
      <pre id="leftHandData"></pre>
    </div>
    <div class="card">
      <h2>Right Hand</h2>
      <pre id="rightHandData"></pre>
    </div>
    <div class="card body-card">
      <h2>Body Tracking</h2>
      <pre id="poseData"></pre>
    </div>
  </div>
  <script
    type="module"
    src="./main.js">
  </script>
</body>
</html>
